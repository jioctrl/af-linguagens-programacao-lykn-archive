    <meta charset="UTF-8">

<body>
    <header class="menu">
        <h1 class="titulo-menu">LYKN Archive</h1>

            <a href="index.html">Home</a>

            <a href="contato.html">Contato</a>
        </nav>

    <main>
        <div class="container">
        <h2>Entre em contato:</h2>
        <form class="form-contato" action="#" method="post">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo:</label>
                <input type="text" id="nome" name="nome" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="_______@gmail.com">
            </div>

            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(XX) 998XX-XXXX">
            </div>

            <div class="mb-3">
                <label for="assunto" class="form-label">Assunto:</label>
                <select id="assunto" name="assunto" class="form-select" required>
                    <option value="">Selecione uma opção</option>
                    <option value="duvida">Dúvida</option>
                    <option value="orcamento">Sugestão</option>
                    <option value="parceria">Parceria</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" class="form-control" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enviar</button>
            <button type="reset" class="btn btn-secondary">Limpar</button>
        </form>
        </div>

        <div class="container">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d1937.7882679117852!2d100.5640425!3d13.7440687!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30e29fa9fa8577f5%3A0xd79928fa092e61e2!2sGMM%20Grammy%20Place%20Building!5e0!3m2!1spt-BR!2sbr!4v1780622567764!5m2!1spt-BR!2sbr"
                width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <p>Endereço GMM - Empresa do LYKN</p>
            </div>

    </main>
